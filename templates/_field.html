<div class="field{% if field.errors %} has-error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} field-check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label>{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
  {% if field.help_text %}<div class="field-help">{{ field.help_text|safe }}</div>{% endif %}
</div>
