{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'chat/favicon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'chat/icon-192.png' %}">
  <link rel="stylesheet" href="{% static 'chat/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}" data-icon="{% static 'chat/icon-192.png' %}" data-sidebar-url="{% if user.is_authenticated %}{% url 'api_sidebar' %}{% endif %}">
  {% block body %}{% endblock %}

  {% if messages %}
  <div class="toasts" id="toasts">
    {% for message in messages %}
      <div class="toast toast-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  {% block scripts %}{% endblock %}
</body>
</html>
