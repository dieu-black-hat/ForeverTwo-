# One-click deploy on Render.com ("New +" → "Blueprint" → pick this repo).
services:
  - type: web
    name: forevertwo
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn chatproject.wsgi:application --workers 2 --threads 4"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: forevertwo-db
          property: connectionString

databases:
  - name: forevertwo-db
    plan: free
